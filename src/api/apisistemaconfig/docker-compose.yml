version: "3.9"
services:
  api-systemconfig-service:
    build:
      context: .
      dockerfile: Dockerfile.php
    ports:
      - "8189:80"
    container_name: apisystemconfig-php
    volumes:
      - .:/var/www/html/systemconfig
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - XDEBUG_MODE=develop,debug
    networks:
      - api-services-controladorprecios
  mysql-systemconfig-service:
    build:
      context: .
      dockerfile: Dockerfile.mysql
    environment:
      - MYSQL_ROOT_PASSWORD=Bank1234#
    ports:
      - "3367:3306"
    container_name: apisystemconfig-mysql
    volumes:
      - mysql-systemconfig-data:/var/lib/mysql
    networks:
      - api-services-controladorprecios
volumes:
  mysql-systemconfig-data:
networks:
  api-services-controladorprecios:
    name: ${COMPOSE_PROJECT_NAME}_default